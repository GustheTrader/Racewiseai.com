
project_id = "pejlrhevvoxpkmrdwens"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
# LOCAL DEVELOPMENT: Use localhost
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "http://localhost:5173"]

# PRODUCTION NOTE: Update these in Supabase Dashboard for production project
# Production Site URL: https://www.racewiseai.com
# Production Redirect URLs: https://www.racewiseai.com, https://www.racewiseai.com/auth/callback, https://racewiseai.com
# Go to: Supabase Dashboard → Authentication → URL Configuration

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# SECURITY FIX: Add session security
enable_anonymous_sign_ins = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"


# SECURITY FIX: Enable JWT verification for user-facing functions
# Scheduled/cron functions use service role key instead

